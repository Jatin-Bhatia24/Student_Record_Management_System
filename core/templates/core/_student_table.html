<div class="table-responsive">
    <table class="table table-striped table-hover align-middle mb-0">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for stud in students %}
            <tr>
                <td>{{ forloop.counter0|add:start }}</td>
                <td>{{ stud.name }}</td>
                <td>{{ stud.roll }}</td>
                <td>
                    <div class="d-flex gap-2">
                        <a href="{% url 'view-student' stud.id %}"
                           class="btn btn-info btn-sm text-white">View</a>

                        <a href="{% url 'edit-student' stud.id %}"
                           class="btn btn-warning btn-sm">Edit</a>

                        <form action="{% url 'delete-student' %}" method="POST" class="m-0"
                              onsubmit="return confirm('Are you sure you want to delete this student?');">
                            {% csrf_token %}
                            <input type="hidden" name="id" value="{{ stud.id }}">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="4" class="text-center text-muted py-4">
                    {% if search %}
                        No students found for "{{ search }}".
                    {% else %}
                        No student records found.
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
