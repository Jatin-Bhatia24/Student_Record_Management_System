
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <title>{% block title %}{% endblock title %} | Student Manager</title>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                Student Manager
            </a>

            <a href="{% url 'add-student' %}" class="btn btn-light btn-sm">
                + Add Student
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block main_content %}{% endblock main_content %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container text-center">
            <p class="mb-1">Student Record Management System</p>
            <small>Developed as a learning project using Python and Django</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    {% block myscripts %}{% endblock myscripts %}

</body>
</html>
